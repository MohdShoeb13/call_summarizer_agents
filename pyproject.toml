[project]
name = "resonant-call-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "langgraph>=1,<2", "langchain-openai>=1,<2", "openai>=2,<3"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "playwright>=1.50"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
